plugins { id 'com.android.application' }
android {
    namespace 'app.xiangzi.schedule.special'
    compileSdk 36
    defaultConfig {
        applicationId 'app.xiangzi.schedule.special'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
        testInstrumentationRunner 'app.xiangzi.schedule.special.SmokeInstrumentation'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (System.getenv('XIANGZI_KEYSTORE')) {
                storeFile file(System.getenv('XIANGZI_KEYSTORE'))
                storePassword System.getenv('XIANGZI_STORE_PASSWORD')
                keyAlias 'xiangzi-special'
                keyPassword System.getenv('XIANGZI_STORE_PASSWORD')
                storeType 'PKCS12'
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
